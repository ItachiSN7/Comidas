name: comidas
description: Premium Fitness & Nutrition App - Smart meal recommendations and fitness tracking
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  provider: ^6.1.1

  # Backend
  supabase_flutter: ^2.3.4

  # UI & Design
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  shimmer: ^3.0.0
  smooth_page_indicator: ^1.1.0

  # Charts & Progress
  fl_chart: ^0.68.0
  percent_indicator: ^4.2.3

  # Images
  cached_network_image: ^3.3.1

  # Storage & Utils
  shared_preferences: ^2.2.3
  uuid: ^4.3.3
  intl: ^0.19.0

  # Icons
  flutter_svg: ^2.0.10+1
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
  fonts:
    - family: SF Pro Display
      fonts:
        - asset: assets/fonts/SFProDisplay-Regular.ttf
        - asset: assets/fonts/SFProDisplay-Medium.ttf
          weight: 500
        - asset: assets/fonts/SFProDisplay-Bold.ttf
          weight: 700
