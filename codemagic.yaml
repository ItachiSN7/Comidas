workflows:
  # ──────────────────────────────────────────────────────────────────────────
  # ANDROID — Debug APK (descarga directa, sin firma)
  # ──────────────────────────────────────────────────────────────────────────
  android-debug:
    name: Android Debug APK
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: 3.22.0
      groups:
        - supabase_credentials
    scripts:
      - name: Set up Flutter
        script: flutter pub get
      - name: Build APK
        script: |
          flutter build apk \
            --release \
            --dart-define=SUPABASE_URL=$SUPABASE_URL \
            --dart-define=SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY \
            --no-tree-shake-icons
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
      - build/app/outputs/flutter-apk/*.apk
    publishing:
      email:
        recipients:
          - $CM_BUILD_UNSUBSCRIBE_URL
        notify:
          success: true
          failure: true

  # ──────────────────────────────────────────────────────────────────────────
  # ANDROID — Release AAB (Google Play)
  # ──────────────────────────────────────────────────────────────────────────
  android-release:
    name: Android Release AAB
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: 3.22.0
      android_signing:
        - comidas_keystore
      groups:
        - supabase_credentials
    scripts:
      - name: Flutter pub get
        script: flutter pub get
      - name: Build AAB
        script: |
          flutter build appbundle \
            --release \
            --dart-define=SUPABASE_URL=$SUPABASE_URL \
            --dart-define=SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY
    artifacts:
      - build/app/outputs/bundle/release/app-release.aab
      - build/app/outputs/mapping/release/mapping.txt
    publishing:
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: internal

  # ──────────────────────────────────────────────────────────────────────────
  # iOS — IPA (requiere Apple Developer Account)
  # ──────────────────────────────────────────────────────────────────────────
  ios-release:
    name: iOS Release IPA
    max_build_duration: 90
    instance_type: mac_mini_m2
    environment:
      flutter: 3.22.0
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.comidas.app
      vars:
        APP_STORE_APPLE_ID: "YOUR_APP_ID"
      groups:
        - supabase_credentials
    scripts:
      - name: Set up code signing
        script: |
          xcode-project use-profiles
      - name: Flutter pub get
        script: flutter pub get
      - name: Flutter build iOS
        script: |
          flutter build ipa \
            --release \
            --export-options-plist=/Users/builder/export_options.plist \
            --dart-define=SUPABASE_URL=$SUPABASE_URL \
            --dart-define=SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
